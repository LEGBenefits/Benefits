<style>

  .filter-panel {
    width: 100%;
    margin-top: 28px;
  }

  .filters {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .filter-field label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: #67748d;
    margin-bottom: 7px;
  }

  .filter-field select {
    width: 100%;
    height: 52px;
    border: 1px solid #dce4ef;
    border-radius: 12px;
    padding: 0 14px;
    background: #f9fbfd;
    color: #26334b;
    font-size: 14px;
    outline: none;
    cursor: pointer;
  }

  .filter-field select:focus {
    border-color: #6c4cff;
    background: white;
    box-shadow: 0 0 0 3px rgba(108,76,255,.08);
  }

  .continue-button {
    width: 100%;
    height: 52px;
    margin-top: 18px;
    border: none;
    border-radius: 12px;
    background: #6c4cff;
    color: white;
    font-size: 15px;
    font-weight: 750;
    cursor: pointer;
  }

  .continue-button:hover:not(:disabled) {
    background: #5235e8;
  }

  .continue-button:disabled {
    opacity: .42;
    cursor: not-allowed;
  }

  .filter-error {
    display: none;
    margin-top: 12px;
    font-size: 12px;
    color: #cf3d5c;
    text-align: center;
  }

  @media(max-width: 650px) {

    .filters {
      grid-template-columns: 1fr;
    }

  }

</style>


<div class="filter-panel">

  <div class="filters">


    <div class="filter-field">

      <label for="companyFilter">
        🏢 Şirkət
      </label>

      <select id="companyFilter">

        <option value="">
          Şirkətinizi seçin
        </option>

        <option value="landau-school">
          LANDAU School
        </option>

        <option value="simurq">
          Simurq Liseyi
        </option>

        <option value="9-11">
          9-11 Hazırlıq Məktəbi
        </option>

        <option value="landau-academy">
          LANDAU Academy
        </option>

        <option value="lion">
          LION
        </option>

        <option value="landau-publishing">
          LANDAU Publishing
        </option>

        <option value="bani">
          BANİ
        </option>

        <option value="admitt">
          Admitt
        </option>

      </select>

    </div>



    <div class="filter-field">

      <label for="positionFilter">
        👤 Vəzifə kateqoriyası
      </label>

      <select id="positionFilter">

        <option value="">
          Vəzifə kateqoriyasını seçin
        </option>

        <option value="manager">
          Rəhbər
        </option>

        <option value="non-manager">
          Qeyri-rəhbər
        </option>

      </select>

    </div>


  </div>


  <button
    class="continue-button"
    id="continueButton"
    disabled
  >
    Davam et →
  </button>


  <div
    class="filter-error"
    id="filterError"
  >
    Zəhmət olmasa şirkət və vəzifə kateqoriyasını seçin.
  </div>

</div>
