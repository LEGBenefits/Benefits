<style>

  .filter-panel {
    background: white;
    max-width: 980px;

    border: 1px solid #e1e7f0;
    border-radius: 18px;

    margin-top: 28px;
    padding: 20px;

    box-shadow:
      0 5px 16px rgba(37, 50, 79, 0.04);
  }


  .filter-heading {
    display: flex;
    align-items: center;
    gap: 8px;

    color: #8290a8;

    font-size: 12px;
    font-weight: 700;

    text-transform: uppercase;

    margin-bottom: 14px;
  }


  .filters {
    display: grid;

    grid-template-columns:
      1.25fr
      1fr
      1.4fr;

    gap: 12px;
  }


  .filter-field label {
    display: block;

    text-align: center;

    font-size: 11px;

    color: #8290a8;

    margin-bottom: 6px;
  }


  .filter-field select {
    width: 100%;

    height: 46px;

    border: 1px solid #dce4ef;
    border-radius: 10px;

    padding: 0 12px;

    background: #f9fbfd;

    color: #34415a;

    font-size: 14px;

    outline: none;

    cursor: pointer;

    transition:
      border-color .15s ease,
      background .15s ease,
      box-shadow .15s ease;
  }


  .filter-field select:hover {
    border-color: #c8d2e1;
  }


  .filter-field select:focus {
    border-color: #a99cff;
    background: white;

    box-shadow:
      0 0 0 3px rgba(108, 76, 255, .08);
  }


  @media (max-width: 800px) {

    .filters {
      grid-template-columns: 1fr;
    }


    .filter-field label {
      text-align: left;
    }

  }


  @media (max-width: 520px) {

    .filter-panel {
      padding: 15px;
      border-radius: 15px;
    }

  }

</style>



<div class="filter-panel">

    <!-- ======================================

</div>
