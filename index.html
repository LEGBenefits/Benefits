const companySelect =
  document.getElementById("company");

const positionSelect =
  document.getElementById("position");

const results =
  document.getElementById("results");


function showBenefits() {

  const selectedCompany =
    companySelect.value;

  const selectedPosition =
    positionSelect.value;


  if (!selectedCompany || !selectedPosition) {
    results.innerHTML = "";
    return;
  }


  const filteredBenefits =
    benefits.filter(function(benefit) {

      return (
        benefit.company === selectedCompany &&
        (
          benefit.position === "all" ||
          benefit.position === selectedPosition
        )
      );

    });


  if (filteredBenefits.length === 0) {

    results.innerHTML = `
      <div class="empty">
        Bu seçim üzrə imtiyazlar hələ əlavə edilməyib.
      </div>
    `;

    return;
  }


  let html = `
    <div class="result-title">
      Sizə uyğun imtiyazlar
    </div>
  `;


  filteredBenefits.forEach(function(benefit) {

    const extraClass =
      benefit.special ? "insurance" : "";

    html += `

      <div class="benefit ${extraClass}">

        <h3>
          ${benefit.name}
        </h3>

        <div class="discount">
          ${benefit.discount}
        </div>

        <div class="description">
          ${benefit.description}
        </div>

      </div>

    `;

  });


  results.innerHTML = html;

}


companySelect.addEventListener(
  "change",
  showBenefits
);

positionSelect.addEventListener(
  "change",
  showBenefits
);
