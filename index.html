    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #172033;

      background:
        linear-gradient(
          135deg,
          #eef4ff 0%,
          #f7f3ff 45%,
          #fff7ed 100%
        );

      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 35px 20px 60px;
    }


    /* =========================
       HEADER
    ========================= */

    .header {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo {
      width: 150px;
      max-width: 60%;
      height: auto;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      color: #172033;
    }

    .subtitle {
      margin-top: 10px;
      color: #68738a;
      font-size: 16px;
    }


    /* =========================
       SELECTOR PANEL
    ========================= */

    .selector-panel {
      background: rgba(255,255,255,0.94);
      border-radius: 22px;
      padding: 25px;
      box-shadow: 0 10px 35px rgba(32,45,75,0.08);
      margin-bottom: 35px;
    }

    .selector-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .selectors {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .selector {
      border-radius: 16px;
      padding: 17px;
    }

    .selector-company {
      background: #eef6ff;
      border: 1px solid #d6e9ff;
    }

    .selector-position {
      background: #f6f0ff;
      border: 1px solid #e5d8ff;
    }

    .selector-group {
      background: #fff5e9;
      border: 1px solid #ffe1bd;
    }

    .selector-label {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .selector-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      font-size: 18px;
    }

    select {
      width: 100%;
      height: 48px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid #d8deea;
      background: white;
      color: #222;
      font-size: 16px;
      cursor: pointer;
    }

    select:focus {
      outline: 2px solid #9db9ff;
      border-color: transparent;
    }


    /* =========================
       SELECTION SUMMARY
    ========================= */

    .selection-summary {
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .summary-pill {
      background: white;
      border: 1px solid #e4e8ef;
      border-radius: 30px;
      padding: 8px 13px;
      font-size: 14px;
    }


    /* =========================
       RESULT HEADER
    ========================= */

    .result-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 25px 0 18px;
    }

    .result-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      background: white;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .result-title {
      font-size: 24px;
      font-weight: bold;
    }

    .result-count {
      color: #7c8495;
      font-size: 14px;
      margin-top: 3px;
    }


    /* =========================
       BENEFIT CARDS
    ========================= */

    .benefits-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .benefit {
      background: white;
      border-radius: 18px;
      padding: 22px;
      border-top: 5px solid #8097ff;
      box-shadow: 0 7px 25px rgba(25,35,65,0.07);

    .benefit.education {

    .benefit.apps {

    }

    .benefit.maternity {
      border-color: #db79a4;
    }

    .benefit.shopping {
      border-color: #d99a3b;
    }

    .benefit.food {
      border-color: #e26e45;
    }

    .benefit.hotel {

    .description {

      font-size: 15px;

       EMPTY / INFO
    ========================= */

      text-align: center;

const selectionSummary =
  document.getElementById("selectionSummary");



/* =====================================================
   NƏTİCƏLƏR
===================================================== */

function showBenefits() {

  const company =
    companySelect.value;

  const position =
    positionSelect.value;

  const group =
    groupSelect.value;


  if (!company || !position || !group) {

    selectionSummary.style.display = "none";

    results.innerHTML = `

      <div class="message">

        <div class="message-icon">
          ✨
        </div>

        Şirkəti, vəzifə kateqoriyasını və imtiyaz qrupunu seçin.

      </div>

    `;

    return;

  }


  const filtered =
    benefits.filter(function(benefit) {

      const companyMatch =
        benefit.company === company;

      const positionMatch =
        benefit.position === "all" ||
        benefit.position === position;

      const groupMatch =
        group === "all" ||
        benefit.group === group;


      return (
        companyMatch &&
        positionMatch &&
        groupMatch
      );

    });



  const companyText =
    companySelect.options[
      companySelect.selectedIndex
    ].text;


  const positionText =
    positionSelect.options[
      positionSelect.selectedIndex
    ].text;


  const groupText =
    groupSelect.options[
      groupSelect.selectedIndex
    ].text;


  selectionSummary.style.display = "flex";

  selectionSummary.innerHTML = `

    <div class="summary-pill">
      🏢 ${companyText}
    </div>

    <div class="summary-pill">
      👤 ${positionText}
    </div>

    <div class="summary-pill">
      🎁 ${groupText}
    </div>

  `;



  if (filtered.length === 0) {

    results.innerHTML = `

      <div class="message">

        <div class="message-icon">
          📭
        </div>

        Bu seçim üzrə imtiyaz hələ əlavə edilməyib.

      </div>

    `;

    return;

  }



  let title = "Bütün imtiyazlar";
  let icon = "⭐";


  if (group !== "all") {

    title =
      groupInfo[group].name;

    icon =
      groupInfo[group].icon;

  }



  let html = `

    <div class="result-header">

      <div class="result-icon">
        ${icon}
      </div>

      <div>

        <div class="result-title">
          ${title}
        </div>

        <div class="result-count">
          ${filtered.length} imtiyaz
        </div>

      </div>

    </div>


    <div class="benefits-grid">

  `;



  filtered.forEach(function(benefit) {

    const benefitIcon =
      groupInfo[benefit.group]
      ? groupInfo[benefit.group].icon
      : "🎁";


    html += `

      <div class="benefit ${benefit.group}">

        <div class="benefit-top">

          <h3>
            ${benefit.name}
          </h3>

          <div class="benefit-icon">
            ${benefitIcon}
          </div>

        </div>

        <div class="discount">
          ${benefit.discount}
        </div>

        <div class="description">
          ${benefit.description}
        </div>

      </div>

    `;

  });


  html += `
    </div>
  `;


  results.innerHTML = html;

}
