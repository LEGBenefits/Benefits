    }

    .selector {

      min-width: 0;
    }

    .selector-company {

    }

    .selector-position {

    }

    .selector-group {

      border: 1px solid #ffe1bd;
    }

    .selector-label {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .selector-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      font-size: 19px;
      flex-shrink: 0;
    }

    select {
      width: 100%;
      height: 50px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid #d8deea;
      background: white;
      color: #222;
      font-size: 16px;
      cursor: pointer;
    }

    select:focus {
      outline: 2px solid #9db9ff;
      border-color: transparent;
    }

       SUMMARY
    ========================= */

      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;

/* =====================================================
   ELEMENTLƏR
===================================================== */

const companySelect =
  document.getElementById("company");

const positionSelect =
  document.getElementById("position");

const groupSelect =
  document.getElementById("benefitGroup");

const results =
  document.getElementById("results");

const selectionSummary =
  document.getElementById("selectionSummary");



/* =====================================================
   NƏTİCƏLƏR
===================================================== */

function showBenefits() {

  const company =
    companySelect.value;

  const position =
    positionSelect.value;

  const group =
    groupSelect.value;



  if (!company || !position || !group) {

    selectionSummary.style.display = "none";

    results.innerHTML = `

      <div class="message">

        <div class="message-icon">
          ✨
        </div>

        Şirkəti, vəzifə kateqoriyasını və imtiyaz qrupunu seçin.

      </div>

    `;

    return;

  }



  const filtered =
    benefits.filter(function(benefit) {

      const companyMatch =
        benefit.company === company;

      const positionMatch =
        benefit.position === "all" ||
        benefit.position === position;

      const groupMatch =
        group === "all" ||
        benefit.group === group;


      return (
        companyMatch &&
        positionMatch &&
        groupMatch
      );

    });



  const companyText =
    companySelect.options[
      companySelect.selectedIndex
    ].text;


  const positionText =
    positionSelect.options[
      positionSelect.selectedIndex
    ].text;


  const groupText =
    groupSelect.options[
      groupSelect.selectedIndex
    ].text;



  selectionSummary.style.display = "flex";

  selectionSummary.innerHTML = `

    <div class="summary-pill">
      🏢 ${companyText}
    </div>

    <div class="summary-pill">
      👤 ${positionText}
    </div>

    <div class="summary-pill">
      🎁 ${groupText}
    </div>

  `;



  if (filtered.length === 0) {

    results.innerHTML = `

      <div class="message">

        <div class="message-icon">
          📭
        </div>

        Bu seçim üzrə imtiyaz hələ əlavə edilməyib.

      </div>

    `;

    return;

  }



  let title = "Bütün imtiyazlar";
  let icon = "⭐";


  if (group !== "all") {

    title =
      groupInfo[group].name;

    icon =
      groupInfo[group].icon;

  }



  let html = `

    <div class="result-header">

      <div class="result-icon">
        ${icon}
      </div>

      <div>

        <div class="result-title">
          ${title}
        </div>

        <div class="result-count">
          ${filtered.length} imtiyaz
        </div>

      </div>

    </div>


    <div class="benefits-grid">

  `;



  filtered.forEach(function(benefit) {

    const benefitIcon =
      groupInfo[benefit.group]
      ? groupInfo[benefit.group].icon
      : "🎁";


    const rule =
      usageRules[benefit.name];


    html += `

      <div class="benefit ${benefit.group}">

        <div class="benefit-top">

          <h3>
            ${benefit.name}
          </h3>

          <div class="benefit-icon">
            ${benefitIcon}
          </div>

        </div>


        <div class="discount">
          ${benefit.discount}
        </div>


        <div class="description">
          ${benefit.description}
        </div>


        ${
          rule
          ? `

          <details class="usage-details">

            <summary>
              📌 Qeyd və istifadə qaydası
            </summary>

            <div class="usage-content">
              ${rule}
            </div>

          </details>

          `
          : ""
        }


      </div>

    `;

  });



  html += `
    </div>
  `;


  results.innerHTML = html;

}



/* =====================================================
   HƏR 3 SEÇİM İŞLƏYİR
===================================================== */

companySelect.addEventListener(
  "change",
  showBenefits
);


positionSelect.addEventListener(
  "change",
  showBenefits
);


groupSelect.addEventListener(
  "change",
  showBenefits
);


</script>
