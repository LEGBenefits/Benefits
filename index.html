<!DOCTYPE html>
<html lang="az">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>LEG Benefits Hub</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at 85% 15%,
          rgba(108,76,255,.13),
          transparent 28%
        ),
        radial-gradient(
          circle at 10% 90%,
          rgba(244,157,74,.10),
          transparent 25%
        ),
        linear-gradient(
          135deg,
          #fbfcff,
          #f5f2ff
        );

      color: #172033;
    }


    .page {
      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 30px 20px;
    }


    .login-layout {
      width: 100%;

      max-width: 980px;

      display: grid;

      grid-template-columns:
        1fr 1fr;

      overflow: hidden;

      background: white;

      border:
        1px solid #e1e7f0;

      border-radius: 28px;

      box-shadow:
        0 28px 70px rgba(45,52,85,.13);
    }


    .intro-side {
      background:
        linear-gradient(
          145deg,
          #6042f3,
          #7b64ed
        );

      color: white;

      padding: 55px 45px;

      display: flex;

      flex-direction: column;

      justify-content: space-between;

      min-height: 520px;

      position: relative;

      overflow: hidden;
    }


    .intro-side::before {
      content: "";

      width: 240px;
      height: 240px;

      border-radius: 50%;

      background:
        rgba(255,255,255,.07);

      position: absolute;

      right: -100px;

      top: -80px;
    }


    .intro-side::after {
      content: "";

      width: 180px;
      height: 180px;

      border-radius: 50%;

      background:
        rgba(255,255,255,.06);

      position: absolute;

      left: -70px;

      bottom: -80px;
    }


    .logo-wrap {
      position: relative;
      z-index: 2;
    }


    .logo {
      width: 62px;
      height: 62px;

      border-radius: 17px;

      background: white;

      padding: 6px;

      object-fit: contain;

      margin-bottom: 25px;
    }


    .intro-title {
      font-size: 37px;

      line-height: 1.08;

      letter-spacing: -.8px;

      font-weight: 800;

      max-width: 380px;
    }


    .intro-description {
      margin-top: 17px;

      max-width: 360px;

      line-height: 1.65;

      font-size: 14px;

      color:
        rgba(255,255,255,.83);
    }


    .intro-bottom {
      position: relative;

      z-index: 2;

      font-size: 13px;

      color:
        rgba(255,255,255,.7);
    }


    .selection-side {
      padding: 55px 45px;

      display: flex;

      flex-direction: column;

      justify-content: center;
    }


    .selection-kicker {
      color: #6c4cff;

      font-size: 12px;

      font-weight: 800;

      text-transform: uppercase;

      letter-spacing: .8px;
    }


    .selection-title {
      font-size: 27px;

      font-weight: 800;

      margin-top: 10px;
    }


    .selection-description {
      font-size: 14px;

      color: #7d8aa5;

      line-height: 1.6;

      margin-top: 8px;
    }


    #filterMount {
      min-height: 190px;
    }


    .loading {
      margin-top: 25px;

      color: #8c98ad;

      font-size: 13px;
    }


    @media(max-width: 760px) {

      .login-layout {
        grid-template-columns: 1fr;
      }


      .intro-side {
        min-height: auto;

        padding: 35px 28px;
      }


      .intro-title {
        font-size: 30px;
      }


      .intro-bottom {
        margin-top: 40px;
      }


      .selection-side {
        padding: 35px 28px;
      }

    }

  </style>

</head>


<body>


<div class="page">

  <div class="login-layout">


    <section class="intro-side">

      <div class="logo-wrap">

        <img
          src="leg-logo.png"
          class="logo"
          alt="LEG"
        >

        <div class="intro-title">
          LEG Benefits Hub
        </div>

        <div class="intro-description">
          Sizin üçün təqdim olunan endirimləri,
          xidmətləri və xüsusi əməkdaş imtiyazlarını
          bir yerdə kəşf edin.
        </div>

      </div>


      <div class="intro-bottom">
        ✨ Employee Perks & Discounts
      </div>

    </section>



    <section class="selection-side">

      <div class="selection-kicker">
        Başlayaq
      </div>

      <div class="selection-title">
        Siz kimsiniz?
      </div>

      <div class="selection-description">
        Sizə uyğun imtiyazları göstərmək üçün
        şirkətinizi və vəzifə kateqoriyanızı seçin.
      </div>


      <div id="filterMount">

        <div class="loading">
          Seçimlər yüklənir...
        </div>

      </div>

    </section>


  </div>

</div>



<script>

async function loadFilter() {

  const filterMount =
    document.getElementById(
      "filterMount"
    );


  try {

    const response =
      await fetch(
        "filter.html"
      );


    if (!response.ok) {

      throw new Error(
        "filter.html tapılmadı"
      );

    }


    filterMount.innerHTML =
      await response.text();


    const companyFilter =
      document.getElementById(
        "companyFilter"
      );


    const positionFilter =
      document.getElementById(
        "positionFilter"
      );


    const continueButton =
      document.getElementById(
        "continueButton"
      );


    const filterError =
      document.getElementById(
        "filterError"
      );



    /* ƏVVƏLKİ SEÇİMİ YADDA SAXLA */

    const savedCompany =
      localStorage.getItem(
        "leg-selected-company"
      );


    const savedPosition =
      localStorage.getItem(
        "leg-selected-position"
      );


    if (savedCompany) {

      companyFilter.value =
        savedCompany;

    }


    if (savedPosition) {

      positionFilter.value =
        savedPosition;

    }



    function updateButton() {

      const ready =
        companyFilter.value &&
        positionFilter.value;


      continueButton.disabled =
        !ready;


      filterError.style.display =
        "none";

    }


    companyFilter.addEventListener(
      "change",
      updateButton
    );


    positionFilter.addEventListener(
      "change",
      updateButton
    );


    updateButton();



    continueButton.addEventListener(
      "click",
      function() {


        if (
          !companyFilter.value ||
          !positionFilter.value
        ) {

          filterError.style.display =
            "block";

          return;

        }



        const companyName =
          companyFilter.options[
            companyFilter.selectedIndex
          ].text;


        const positionName =
          positionFilter.options[
            positionFilter.selectedIndex
          ].text;



        localStorage.setItem(
          "leg-selected-company",
          companyFilter.value
        );


        localStorage.setItem(
          "leg-selected-company-name",
          companyName
        );


        localStorage.setItem(
          "leg-selected-position",
          positionFilter.value
        );


        localStorage.setItem(
          "leg-selected-position-name",
          positionName
        );



        window.location.href =
          "home.html";

      }
    );


  }

  catch (error) {

    console.error(
      error
    );


    filterMount.innerHTML = `

      <div class="loading">

        ⚠️ filter.html yüklənmədi.

      </div>

    `;

  }

}


loadFilter();

</script>


</body>
</html>
