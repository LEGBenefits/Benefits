<!DOCTYPE html>
<html lang="az">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>LEG Benefits Hub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      color: #172033;

      background:
        radial-gradient(
          circle at 90% 10%,
          rgba(108, 76, 255, .13),
          transparent 28%
        ),
        radial-gradient(
          circle at 8% 90%,
          rgba(244, 157, 74, .09),
          transparent 24%
        ),
        linear-gradient(
          135deg,
          #fbfcff 0%,
          #f6f3ff 100%
        );
    }

    .page {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px 20px;
    }

    .login-card {
      width: 100%;
      max-width: 980px;

      display: grid;
      grid-template-columns: 1fr 1fr;

      background: white;

      border: 1px solid #e1e7f0;
      border-radius: 28px;

      overflow: hidden;

      box-shadow:
        0 28px 70px rgba(45, 52, 85, .13);
    }

    /* LEFT SIDE */

    .intro-side {
      min-height: 520px;

      padding: 55px 45px;

      display: flex;
      flex-direction: column;
      justify-content: space-between;

      color: white;

      position: relative;
      overflow: hidden;

      background:
        linear-gradient(
          145deg,
          #5f40f4 0%,
          #7258ed 100%
        );
    }

    .intro-side::before {
      content: "";

      position: absolute;

      width: 230px;
      height: 230px;

      border-radius: 50%;

      right: -85px;
      top: -85px;

      background:
        rgba(255, 255, 255, .08);
    }

    .intro-side::after {
      content: "";

      position: absolute;

      width: 180px;
      height: 180px;

      border-radius: 50%;

      left: -70px;
      bottom: -80px;

      background:
        rgba(255, 255, 255, .06);
    }

    .intro-main {
      position: relative;
      z-index: 2;
    }

    .logo {
      width: 64px;
      height: 64px;

      object-fit: contain;

      background: white;

      padding: 7px;

      border-radius: 17px;

      margin-bottom: 28px;
    }

    .intro-title {
      font-size: 38px;
      line-height: 1.08;

      letter-spacing: -.8px;

      font-weight: 800;
    }

    .intro-text {
      max-width: 370px;

      margin-top: 17px;

      font-size: 14px;
      line-height: 1.7;

      color:
        rgba(255, 255, 255, .84);
    }

    .intro-bottom {
      position: relative;
      z-index: 2;

      font-size: 13px;

      color:
        rgba(255, 255, 255, .75);
    }

    /* RIGHT SIDE */

    .selection-side {
      padding: 55px 45px;

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .selection-kicker {
      color: #6c4cff;

      font-size: 12px;
      font-weight: 800;

      letter-spacing: .8px;

      text-transform: uppercase;
    }

    .selection-title {
      margin-top: 10px;

      font-size: 28px;
      font-weight: 800;
    }

    .selection-text {
      margin-top: 8px;

      color: #7d8aa5;

      font-size: 14px;
      line-height: 1.6;
    }

    #filterMount {
      min-height: 190px;
    }

    .loading {
      margin-top: 28px;

      padding: 18px;

      border: 1px solid #e1e7f0;
      border-radius: 14px;

      color: #8490a5;

      background: #fafbfd;

      font-size: 13px;
    }

    .load-error {
      margin-top: 28px;

      padding: 18px;

      border-radius: 14px;

      border: 1px solid #f1d5da;

      background: #fff7f8;

      color: #b13e55;

      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 760px) {
      .login-card {
        grid-template-columns: 1fr;
      }

      .intro-side {
        min-height: auto;

        padding: 35px 28px;
      }

      .intro-title {
        font-size: 31px;
      }

      .intro-bottom {
        margin-top: 40px;
      }

      .selection-side {
        padding: 35px 28px;
      }
    }
  </style>
</head>


<body>

  <div class="page">

    <div class="login-card">


      <!-- LEFT -->

      <section class="intro-side">

        <div class="intro-main">

          <img
            src="leg-logo.png"
            alt="LEG"
            class="logo"
          >

          <div class="intro-title">
            LEG Benefits Hub
          </div>

          <div class="intro-text">
            Sizin üçün təqdim olunan endirimləri,
            xidmətləri və xüsusi əməkdaş imtiyazlarını
            bir yerdə kəşf edin.
          </div>

        </div>


        <div class="intro-bottom">
          ✨ Employee Perks & Discounts
        </div>

      </section>



      <!-- RIGHT -->

      <section class="selection-side">

        <div class="selection-kicker">
          Başlayaq
        </div>

        <div class="selection-title">
          Siz kimsiniz?
        </div>

        <div class="selection-text">
          Sizə uyğun imtiyazları göstərmək üçün
          şirkətinizi və vəzifə kateqoriyanızı seçin.
        </div>


        <div id="filterMount">

          <div class="loading">
            Seçimlər yüklənir...
          </div>

        </div>

      </section>


    </div>

  </div>



  <script>
    async function loadFilter() {

      const filterMount =
        document.getElementById("filterMount");

      try {

        /*
          filter.html URL-ni index.html-ın
          yerləşdiyi qovluğa əsasən avtomatik yaradır.
        */

        const filterUrl =
          new URL(
            "filter.html",
            window.location.href
          );


        const response =
          await fetch(
            filterUrl.href,
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "Filter yüklənmədi. HTTP status: " +
            response.status
          );

        }


        const filterHtml =
          await response.text();


        filterMount.innerHTML =
          filterHtml;



        /* FILTER ELEMENTLƏRİ */

        const companyFilter =
          document.getElementById(
            "companyFilter"
          );


        const positionFilter =
          document.getElementById(
            "positionFilter"
          );


        const continueButton =
          document.getElementById(
            "continueButton"
          );


        const filterError =
          document.getElementById(
            "filterError"
          );



        /*
          filter.html içində bu elementlər
          yoxdursa, səhvi dərhal göstər.
        */

        if (
          !companyFilter ||
          !positionFilter ||
          !continueButton
        ) {

          throw new Error(
            "filter.html daxilində lazımi elementlər tapılmadı."
          );

        }



        /* ƏVVƏLKİ SEÇİMLƏR */

        const savedCompany =
          localStorage.getItem(
            "leg-selected-company"
          );


        const savedPosition =
          localStorage.getItem(
            "leg-selected-position"
          );


        if (savedCompany) {

          companyFilter.value =
            savedCompany;

        }


        if (savedPosition) {

          positionFilter.value =
            savedPosition;

        }



        /* DAVAM ET BUTTON */

        function updateContinueButton() {

          const isReady =
            companyFilter.value !== ""
            &&
            positionFilter.value !== "";


          continueButton.disabled =
            !isReady;


          if (filterError) {

            filterError.style.display =
              "none";

          }

        }



        companyFilter.addEventListener(
          "change",
          updateContinueButton
        );


        positionFilter.addEventListener(
          "change",
          updateContinueButton
        );


        updateContinueButton();



        /* DAVAM ET */

        continueButton.addEventListener(
          "click",
          function() {

            const company =
              companyFilter.value;


            const position =
              positionFilter.value;



            if (
              !company ||
              !position
            ) {

              if (filterError) {

                filterError.style.display =
                  "block";

              }

              return;

            }



            const companyName =
              companyFilter.options[
                companyFilter.selectedIndex
              ].text;


            const positionName =
              positionFilter.options[
                positionFilter.selectedIndex
              ].text;



            /* SEÇİMLƏRİ YADDA SAXLA */

            localStorage.setItem(
              "leg-selected-company",
              company
            );


            localStorage.setItem(
              "leg-selected-company-name",
              companyName
            );


            localStorage.setItem(
              "leg-selected-position",
              position
            );


            localStorage.setItem(
              "leg-selected-position-name",
              positionName
            );



            /*
              home.html də eyni qovluqdadır.
              URL avtomatik yaradılır.
            */

            const homeUrl =
              new URL(
                "home.html",
                window.location.href
              );


            window.location.href =
              homeUrl.href;

          }
        );

      }

      catch (error) {

        console.error(
          "LEG Benefits filter error:",
          error
        );


        filterMount.innerHTML = `

          <div class="load-error">

            ⚠️ Seçim bölməsi yüklənmədi.

            <br><br>

            <strong>Səbəb:</strong>
            ${error.message}

          </div>

        `;

      }

    }


    loadFilter();
  </script>

</body>

</html>
