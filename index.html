/* QRUPLARIN SIRASI */

const groupOrder = [

/* =====================================================
   ELEMENTLƏR
===================================================== */

const companySelect =
  document.getElementById("company");

const positionSelect =
  document.getElementById("position");

const groupSelect =
  document.getElementById("benefitGroup");

const groupBox =
  document.getElementById("groupBox");

const results =
  document.getElementById("results");



/* =====================================================
   QRUPLARI GÖSTƏR
===================================================== */

function updateGroups() {

  const company =
    companySelect.value;

  const position =
    positionSelect.value;


  results.innerHTML = "";


  if (!company || !position) {

    groupBox.style.display = "none";

    groupSelect.innerHTML =
      '<option value="">İmtiyaz qrupunu seçin</option>';

    return;

  }


  const availableBenefits =
    benefits.filter(function(benefit) {

      return (

        benefit.company === company &&

        (
          benefit.position === "all" ||
          benefit.position === position
        )

      );

    });


  if (availableBenefits.length === 0) {

    groupBox.style.display = "none";

    results.innerHTML = `

      <div class="empty">

        Bu şirkət üzrə imtiyazlar
        hələ əlavə edilməyib.

      </div>

    `;

    return;

  }


  const availableGroups =
    [...new Set(
      availableBenefits.map(
        benefit => benefit.group
      )
    )];


  groupSelect.innerHTML = `

    <option value="">
      İmtiyaz qrupunu seçin
    </option>

    <option value="all">
      Bütün imtiyazlar
    </option>

  `;


  groupOrder.forEach(function(group) {

    if (availableGroups.includes(group)) {

      groupSelect.innerHTML += `

        <option value="${group}">
          ${groupNames[group]}
        </option>

      `;

    }

  });


  groupBox.style.display = "block";

}



/* =====================================================
   BENEFİTLƏRİ GÖSTƏR
===================================================== */

function showBenefits() {

  const company =
    companySelect.value;

  const position =
    positionSelect.value;

  const group =
    groupSelect.value;


  if (!group) {

    results.innerHTML = "";

    return;

  }


  const filtered =
    benefits.filter(function(benefit) {

      const companyMatch =
        benefit.company === company;

      const positionMatch =
        benefit.position === "all" ||
        benefit.position === position;

      const groupMatch =
        group === "all" ||
        benefit.group === group;


      return (
        companyMatch &&
        positionMatch &&
        groupMatch
      );

    });


  let title;


  if (group === "all") {

    title = "Bütün imtiyazlar";

  } else {

    title = groupNames[group];

  }


  let html = `

    <div class="result-title">
      ${title}
    </div>

  `;


  filtered.forEach(function(benefit) {

    html += `

      <div class="benefit">

        <h3>
          ${benefit.name}
        </h3>

        <div class="discount">
          ${benefit.discount}
        </div>

        <div class="description">
          ${benefit.description}
        </div>

      </div>

    `;

  });


  results.innerHTML = html;

}



/* =====================================================
   EVENTLƏR
===================================================== */

companySelect.addEventListener(
  "change",
  updateGroups
);


positionSelect.addEventListener(

  updateGroups
);


groupSelect.addEventListener(
  "change",
  showBenefits
);
